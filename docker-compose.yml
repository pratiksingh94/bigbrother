services:
    postgres:
        image: postgres:18
        environment:
            - POSTGRES_DB=bigbrother
            - POSTGRES_USER=bigbrother
            - POSTGRES_PASSWORD=bigbrother

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bigbrother -d bigbrother"]
            interval: 2s
            timeout: 3s
            retries: 15

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql

    backend:
        build: ./backend
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            - DATABASE_URL=postgresql://bigbrother:bigbrother@postgres/bigbrother
        ports:
            - "8000:8000"

    dashboard:
        build:
            context: ./dashboard
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        depends_on:
            - backend
        ports:
            - "3000:3000"

volumes:
    postgres_data:

