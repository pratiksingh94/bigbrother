services:
    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            - POSTGRES_DB=bigbrother
            - POSTGRES_USER=bigbrother
            - POSTGRES_PASSWORD=bigbrother

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bigbrother -d bigbrother"]
            interval: 2s
            timeout: 3s
            retries: 15

        ports:
            - "127.0.0.1:5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql

    backend:
        image: ghcr.io/pratiksingh94/bigbrother-backend:latest
        build: ./backend
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            - DATABASE_URL=postgresql://bigbrother:bigbrother@postgres/bigbrother
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        ports:
            - "127.0.0.1:8000:8000"

    dashboard:
        image: ghcr.io/pratiksingh94/bigbrother-dashboard:latest
        build:
            context: ./dashboard
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        ports:
            - "3000:3000"

volumes:
    postgres_data:
