name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lilbro/go.mod

      - name: vet and build
        working-directory: lilbro
        run: |
          go vet ./...
          go build ./...
